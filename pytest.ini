[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: unit tests
    integration: integration tests
    contract: API contract tests
    e2e: end-to-end smoke tests (skipped by default)
    slow: slow running tests
addopts = -m "not e2e"
